plugins {
    id 'com.android.application'
}

android {
    namespace 'cn.edu.cumtb.schedule'
    compileSdk 34

    defaultConfig {
        applicationId "cn.edu.cumtb.schedule"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
            // 使用 debug 签名配置以便直接生成可安装的 release APK，也可替换为自定义签名
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.webkit:webkit:1.10.0'
}
